<head>

    <meta content="Simule online seu empréstimo ou financiamento para MEI, ME e EPP com a Capital SC Empresa Simples de Crédito: veja parcelas, total pago e juros na hora." name="description">
    <link rel="canonical" href="https://capitalscfomento.com.br/simulacao/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">

    <meta property="og:description" content="Simule online seu empréstimo ou financiamento para MEI, ME e EPP com a Capital SC Empresa Simples de Crédito: veja parcelas, total pago e juros na hora.">
    <meta property="og:image" content="https://capitalscfomento.com.br/esc/assets/img/hero-bg.jpeg">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:image:alt" content="Baía Sul de Florianópolis (SC)">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <style>
    img {
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    </style>
</head>
<body class="bg-dark">
    <div class="container">
        <div class="row">
            <div class="col-6 mx-auto">
                <div class="card card-body text-center mt-5">
                    <img src="images/logo.png" alt="Capital" style="width: 50%; height: 50%" class="center">
                    <br>
                    <h1 class="heading display-5 pb-3">Simulação</h1>
                    <br>
                    <form id="loan-form">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">Valor do Empréstimo</span>
                                </div>
                                <select class="form-control" id="amount">
                                        <option value="3000">R$ 3.000,00</option>
                                        <option value="5000">R$ 5.000,00</option>
                                        <option value="8000">R$ 8.000,00</option>
                                        <option value="10000">R$ 10.000,00</option>
                                        <option value="12000">R$ 12.000,00</option>
                                        <option value="15000">R$ 15.000,00</option>
                                        <option value="20000">R$ 20.000,00</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">Juros</span>
                                </div>
                                <select class="form-control" id="interest">
                                        <option value="5">5%</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">Prazo</span>
                                </div>
                                <select class="form-control" id="years">
                                        <option value="6">6 meses</option>
                                        <option value="12">12 meses</option>
                                        <option value="18">18 meses</option>
                                        <option value="24">24 meses</option>
                                        <option value="30">30 meses</option>
                                        <option value="36">36 meses</option>
                                </select>
                            </div>
                        </div>
                        <br>
                        <div class="form-group">
                            <input type="submit" value="Calcular" class="btn btn-dark btn-block">
                        </div>
                    </form>

                    <!-- Loading Animation -->
                    <div id="loading">
                        <img src="images/loading.gif" alt="Loading Animation">
                    </div>

                    <!-- Results -->
                    <div id="results" class="pt-4">
                        <h2>Resultado</h2>
                        <br>
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">Pagamento mensal</span>
                                </div>
                                <input type="text" class="form-control" id="monthly-payment" disabled>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">Valor total pago ao final do empréstimo</span>
                                </div>
                                <input type="text" class="form-control" id="total-payment" disabled>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">Total de juros ao final do empréstimo</span>
                                </div>
                                <input type="text" class="form-control" id="total-interest" disabled>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js" defer></script>
</body>
</html>
